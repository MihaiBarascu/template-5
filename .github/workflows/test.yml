name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      business_type:
        description: 'Business type to test'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - frizerie
          - dentist
          - avocat
          - restaurant
          - auto-service
          - constructii
          - salon
          - magazin

env:
  CI: true
  DATABASE_URI: ${{ secrets.DATABASE_URI || 'mongodb://localhost:27017/template5-test' }}
  TEST_PORT: 3005
  BASE_URL: http://localhost:3005

jobs:
  # Quick smoke test on every push
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Seed test database
        run: pnpm seed:frizerie
        env:
          DATABASE_URI: mongodb://localhost:27017/template5-test

      - name: Run smoke tests
        run: pnpm test:e2e tests/e2e/smoke.spec.ts
        env:
          DATABASE_URI: mongodb://localhost:27017/template5-test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-report
          path: playwright-report/
          retention-days: 7

  # Full test suite (runs on main branch or manual trigger)
  full-test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    strategy:
      fail-fast: false
      matrix:
        business: [frizerie, dentist, avocat, restaurant, auto-service, constructii, salon, magazin]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Seed ${{ matrix.business }}
        run: pnpm seed:${{ matrix.business }}
        env:
          DATABASE_URI: mongodb://localhost:27017/template5-test

      - name: Run production ready tests for ${{ matrix.business }}
        run: pnpm test:e2e tests/e2e/production-ready.spec.ts
        env:
          DATABASE_URI: mongodb://localhost:27017/template5-test
          SEED_TYPE: ${{ matrix.business }}

      - name: Generate screenshots
        run: pnpm test:screenshots
        env:
          DATABASE_URI: mongodb://localhost:27017/template5-test
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ matrix.business }}
          path: |
            playwright-report/
            tests/e2e/screenshots/
          retention-days: 30

  # Summary job
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [smoke-test, full-test]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.smoke-test.result }}" == "success" ]; then
            echo "- Smoke Test: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Smoke Test: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.full-test.result }}" == "success" ]; then
            echo "- Full Test Suite: PASSED" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.full-test.result }}" == "skipped" ]; then
            echo "- Full Test Suite: SKIPPED (only runs on main)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Full Test Suite: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
