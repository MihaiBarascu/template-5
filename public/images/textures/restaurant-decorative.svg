<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <!-- Wine Glass -->
  <g fill="white" opacity="0.8">
    <ellipse cx="80" cy="60" rx="35" ry="20"/>
    <path d="M65 60 Q80 120 80 150 L80 200"/>
    <rect x="75" y="60" width="10" height="140"/>
    <ellipse cx="80" cy="200" rx="30" ry="8"/>
  </g>

  <!-- Fork -->
  <g fill="white" opacity="0.7" transform="translate(150, 30)">
    <rect x="20" y="0" width="4" height="50"/>
    <rect x="30" y="0" width="4" height="50"/>
    <rect x="40" y="0" width="4" height="50"/>
    <rect x="50" y="0" width="4" height="50"/>
    <rect x="18" y="45" width="38" height="15" rx="3"/>
    <rect x="32" y="55" width="10" height="120" rx="2"/>
  </g>

  <!-- Knife -->
  <g fill="white" opacity="0.7" transform="translate(220, 30)">
    <path d="M30 0 L45 0 L45 80 Q37 85 30 80 Z"/>
    <rect x="32" y="75" width="10" height="100" rx="2"/>
  </g>

  <!-- Plate with food swirl -->
  <g fill="white" opacity="0.6" transform="translate(60, 250)">
    <circle cx="100" cy="80" r="70" stroke="white" stroke-width="6" fill="none"/>
    <circle cx="100" cy="80" r="55" stroke="white" stroke-width="2" fill="none"/>
    <path d="M70 70 Q85 50 100 70 Q115 90 130 70" stroke="white" stroke-width="4" fill="none"/>
    <circle cx="85" cy="85" r="8"/>
    <circle cx="115" cy="75" r="6"/>
    <circle cx="100" cy="95" r="5"/>
  </g>

  <!-- Chef Hat -->
  <g fill="white" opacity="0.5" transform="translate(280, 180)">
    <ellipse cx="50" cy="80" rx="45" ry="15"/>
    <rect x="10" y="30" width="80" height="50" rx="5"/>
    <ellipse cx="25" cy="30" rx="20" ry="25"/>
    <ellipse cx="50" cy="20" rx="22" ry="28"/>
    <ellipse cx="75" cy="30" rx="20" ry="25"/>
  </g>

  <!-- Spoon -->
  <g fill="white" opacity="0.4" transform="translate(30, 350)">
    <ellipse cx="25" cy="30" rx="18" ry="25"/>
    <rect x="20" y="50" width="10" height="100" rx="2"/>
  </g>

  <!-- Wine Bottle silhouette -->
  <g fill="white" opacity="0.35" transform="translate(300, 320)">
    <rect x="30" y="0" width="20" height="25" rx="3"/>
    <rect x="25" y="20" width="30" height="15"/>
    <rect x="20" y="30" width="40" height="120" rx="5"/>
    <ellipse cx="40" cy="150" rx="20" ry="5"/>
  </g>

  <!-- Steam/aroma curves -->
  <g stroke="white" stroke-width="3" fill="none" opacity="0.3">
    <path d="M320 100 Q330 80 320 60 Q310 40 320 20"/>
    <path d="M340 110 Q350 85 340 60 Q330 35 340 10"/>
    <path d="M360 105 Q370 82 360 58 Q350 35 360 12"/>
  </g>
</svg>