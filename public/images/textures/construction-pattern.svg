<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Hammer -->
  <g fill="white">
    <rect x="25" y="50" width="8" height="45" rx="2"/>
    <rect x="12" y="40" width="34" height="15" rx="3"/>
  </g>
  <!-- Wrench -->
  <g fill="white" transform="rotate(25 130 50)">
    <rect x="100" y="45" width="60" height="10" rx="2"/>
    <circle cx="100" cy="50" r="12" stroke="white" stroke-width="4" fill="none"/>
    <circle cx="165" cy="50" r="8" stroke="white" stroke-width="3" fill="none"/>
  </g>
  <!-- Gear -->
  <g fill="white">
    <circle cx="50" cy="140" r="22"/>
    <circle cx="50" cy="140" r="8" fill="#1f1f1f"/>
    <rect x="46" y="112" width="8" height="12"/>
    <rect x="46" y="156" width="8" height="12"/>
    <rect x="22" y="136" width="12" height="8"/>
    <rect x="66" y="136" width="12" height="8"/>
  </g>
  <!-- Bricks -->
  <g fill="white">
    <rect x="110" y="120" width="35" height="15" rx="2"/>
    <rect x="150" y="120" width="35" height="15" rx="2"/>
    <rect x="128" y="140" width="35" height="15" rx="2"/>
    <rect x="110" y="160" width="35" height="15" rx="2"/>
    <rect x="150" y="160" width="35" height="15" rx="2"/>
  </g>
  <!-- Ruler -->
  <g fill="white">
    <rect x="130" y="30" width="55" height="12"/>
    <rect x="135" y="30" width="2" height="6"/>
    <rect x="145" y="30" width="2" height="8"/>
    <rect x="155" y="30" width="2" height="6"/>
    <rect x="165" y="30" width="2" height="8"/>
    <rect x="175" y="30" width="2" height="6"/>
  </g>
</svg>