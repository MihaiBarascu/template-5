<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Scissors -->
  <g fill="white">
    <ellipse cx="35" cy="35" rx="6" ry="18" transform="rotate(-25 35 35)"/>
    <ellipse cx="55" cy="35" rx="6" ry="18" transform="rotate(25 55 35)"/>
    <circle cx="45" cy="50" r="6"/>
  </g>
  <!-- Comb -->
  <g fill="white">
    <rect x="100" y="25" width="50" height="10" rx="2"/>
    <rect x="105" y="35" width="4" height="15"/>
    <rect x="115" y="35" width="4" height="15"/>
    <rect x="125" y="35" width="4" height="15"/>
    <rect x="135" y="35" width="4" height="15"/>
    <rect x="145" y="35" width="4" height="12"/>
  </g>
  <!-- Razor -->
  <g fill="white">
    <rect x="25" y="100" width="40" height="8" rx="2"/>
    <path d="M65 100 L85 104 L65 108 Z"/>
  </g>
  <!-- Barber pole -->
  <g fill="white">
    <rect x="140" y="80" width="15" height="70" rx="3"/>
  </g>
  <g fill="#1f1f1f">
    <rect x="143" y="90" width="9" height="8" transform="rotate(30 147 94)"/>
    <rect x="143" y="110" width="9" height="8" transform="rotate(30 147 114)"/>
    <rect x="143" y="130" width="9" height="8" transform="rotate(30 147 134)"/>
  </g>
  <!-- Hair dryer -->
  <g fill="white">
    <ellipse cx="60" cy="160" rx="18" ry="10"/>
    <rect x="76" y="153" width="25" height="14" rx="3"/>
    <rect x="54" y="168" width="12" height="20" rx="2"/>
  </g>
</svg>