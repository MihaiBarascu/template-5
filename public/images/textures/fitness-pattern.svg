<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Dumbbell 1 -->
  <g fill="white">
    <rect x="15" y="40" width="12" height="20" rx="2"/>
    <rect x="27" y="47" width="25" height="6" rx="1"/>
    <rect x="52" y="40" width="12" height="20" rx="2"/>
  </g>
  <!-- Kettlebell -->
  <g fill="white">
    <circle cx="120" cy="45" r="18"/>
    <ellipse cx="120" cy="22" rx="10" ry="6"/>
    <rect x="108" y="20" width="4" height="12"/>
    <rect x="128" y="20" width="4" height="12"/>
  </g>
  <!-- Dumbbell 2 rotated -->
  <g fill="white" transform="rotate(30 100 130)">
    <rect x="60" y="125" width="10" height="15" rx="2"/>
    <rect x="70" y="130" width="20" height="5" rx="1"/>
    <rect x="90" y="125" width="10" height="15" rx="2"/>
  </g>
  <!-- Weight plate -->
  <g fill="white">
    <circle cx="160" cy="140" r="25" stroke="white" stroke-width="8" fill="none"/>
    <circle cx="160" cy="140" r="8"/>
  </g>
  <!-- Barbell -->
  <g fill="white">
    <rect x="20" y="160" width="15" height="25" rx="2"/>
    <rect x="35" y="170" width="50" height="5" rx="1"/>
    <rect x="85" y="160" width="15" height="25" rx="2"/>
  </g>
</svg>